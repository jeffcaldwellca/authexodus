[package]
name = "authexodus"
description = "authexodus: guided Authy export (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "authexodus_lib"
path = "src/lib.rs"

[[bin]]
name = "authexodus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
authexodus-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
if-addrs = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# Switches on `proxy::TestUpstream` (a stand-in for Authy) for this crate's tests only. The
# entry under [dependencies] stays without the feature, so a built app never has it.
authexodus-core = { path = "../crates/core", features = ["test-upstream"] }
tempfile = "3"
async-trait = "0.1"
# The end-to-end test's stand-in Authy server and simulated phone, and the synthetic backup it
# encrypts. Same versions as the core, so nothing new is downloaded.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "std"] }
base64 = "0.22"
csv = "1"
