# Every third-party action is pinned to a full commit, with the version it was taken from in
# a comment. To move one forward: `git ls-remote https://github.com/OWNER/REPO refs/tags/TAG`
# (for an annotated tag, the line ending in ^{} is the commit).

name: ci

on:
  pull_request:
  push:
    branches: [main, "build/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # src-tauri needs ui/dist to exist; its build.rs makes a placeholder, so no UI build first.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm -C ui test
      - run: pnpm -C ui exec tsc --noEmit
      # The production build, which ends with the check that nothing meant for development
      # (the in-memory fake, the dev panel) is in the bundle.
      - run: pnpm -C ui build
