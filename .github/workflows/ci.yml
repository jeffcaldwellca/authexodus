# Every third-party action is pinned to a full commit, with the version it was taken from in
# a comment. To move one forward: `git ls-remote https://github.com/OWNER/REPO refs/tags/TAG`
# (for an annotated tag, the line ending in ^{} is the commit).

name: ci

on:
  pull_request:
  push:
    branches: [main, "build/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # src-tauri needs ui/dist to exist; its build.rs makes a placeholder, so no UI build first.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm -C ui test
      - run: pnpm -C ui exec tsc --noEmit
      # The production build, which ends with the check that nothing meant for development
      # (the in-memory fake, the dev panel) is in the bundle.
      - run: pnpm -C ui build
