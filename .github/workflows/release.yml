# Release: builds a universal, signed and notarized .dmg when a version tag is pushed, and
# attaches it to a DRAFT GitHub release. Nothing is published until a person presses Publish.
#
# Repository secrets this workflow needs (Settings > Secrets and variables > Actions).
# The names are the ones the Tauri CLI and tauri-action read for macOS signing and notarization
# (https://v2.tauri.app/distribute/sign/macos/). All six are required; the first job step stops
# the run with a plain message if any is missing, so an unsigned build is never produced.
#
#   APPLE_CERTIFICATE           the "Developer ID Application" certificate exported as .p12,
#                               then base64-encoded:  base64 -i certificate.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD  the password chosen when exporting that .p12
#   APPLE_SIGNING_IDENTITY      the certificate's name, for example
#                               "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                    the Apple ID email used for notarization
#   APPLE_PASSWORD              an app-specific password for that Apple ID (not the real password)
#   APPLE_TEAM_ID               the 10-character team ID from the Apple Developer membership page
#
# GITHUB_TOKEN is supplied by GitHub itself and needs no setup.
#
# Alternative to APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID: an App Store Connect API key
# (APPLE_API_ISSUER, APPLE_API_KEY, and APPLE_API_KEY_PATH pointing at the downloaded .p8 file).
# This workflow does not use it: the .p8 has to exist as a file on the runner, which needs an
# extra step to write it from a secret. Switch only if the Apple ID route is not wanted.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Stop now if a signing secret is missing
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::This release would be unsigned. Add these repository secrets and push the tag again:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: The tag must match the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Tag and version differ::Tag is $GITHUB_REF_NAME but src-tauri/tauri.conf.json says $version."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # No version here: pnpm/action-setup reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build
      - run: cargo test --workspace
      - run: pnpm -C ui test

      - name: Build, sign and notarize the universal .dmg
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: authexodus ${{ github.ref_name }}
          releaseBody: "Pre-release. Read the README before using it, and run docs/manual-device-checklist.md if you want to help verify it."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg

      - name: Check that the .dmg is signed and notarized
        run: |
          dmg=$(find target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          echo "Checking $dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg" || echo "::warning::The .dmg itself has no stapled ticket; checking the app inside."
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          app=$(find "$mnt" -maxdepth 1 -name "*.app" | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          hdiutil detach "$mnt" -quiet

      - name: Attach a checksum file to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd target/universal-apple-darwin/release/bundle/dmg
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
