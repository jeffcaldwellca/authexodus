# Release: builds a universal, signed and notarized .dmg when a version tag is pushed, and
# attaches it to a DRAFT GitHub release. Nothing is published until a person presses Publish.
#
# Repository secrets this workflow needs (Settings > Secrets and variables > Actions). They use
# the same names as the maintainer's other signed macOS apps, so the same values go in. All four
# are required; the first job step stops the run with a plain message if any is missing, so an
# unsigned build is never produced.
#
#   MACOS_CERTIFICATE           the "Developer ID Application" certificate exported as .p12,
#                               then base64-encoded:  base64 -i certificate.p12 | pbcopy
#   MACOS_CERTIFICATE_PASSWORD  the password chosen when exporting that .p12
#   NOTARIZATION_APPLE_ID       the Apple ID email used for notarization
#   NOTARIZATION_PASSWORD       an app-specific password for that Apple ID (not the real password)
#
# The signing identity and team ID are not secret (they are printed in every signed app), so
# they are written below as SIGNING_IDENTITY and TEAM_ID. The Tauri CLI and tauri-action read
# the APPLE_* variable names (https://v2.tauri.app/distribute/sign/macos/); the steps below map
# these secrets onto them.
#
# GITHUB_TOKEN is supplied by GitHub itself and needs no setup.
#
# Who can see the signing secrets: only the two steps that name them, the check at the top
# and the build-and-sign step. Installing dependencies, building the UI and running the tests
# happen in between without them. (The build-and-sign step itself still compiles the app, so
# build scripts of the app's dependencies run with the secrets in their environment; that is
# inherent in signing during the build.) Nothing is restored from a cache in this job: a
# cache is written by ordinary CI runs and must not be able to change what gets signed.
#
# Every third-party action is pinned to a full commit, with the version it was taken from in
# a comment. To move one forward: `git ls-remote https://github.com/OWNER/REPO refs/tags/TAG`
# (for an annotated tag, the line ending in ^{} is the commit).
#
# `contents: write` is needed by the step that creates the draft release and by the one that
# attaches the checksum file; permissions cannot be set per step, so the job has it. The
# checkout does not leave the token on disk, so the steps in between cannot use it.
#
# Alternative to an Apple ID and app-specific password for notarization: an App Store Connect API key
# (APPLE_API_ISSUER, APPLE_API_KEY, and APPLE_API_KEY_PATH pointing at the downloaded .p8 file).
# This workflow does not use it: the .p8 has to exist as a file on the runner, which needs an
# extra step to write it from a secret. Switch only if the Apple ID route is not wanted.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SIGNING_IDENTITY: "Developer ID Application: Jeffrey Caldwell (88ZPCYS252)"
  TEAM_ID: "88ZPCYS252"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Stop now if a signing secret is missing
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          missing=""
          [ -n "$APPLE_CERTIFICATE" ] || missing="$missing MACOS_CERTIFICATE"
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || missing="$missing MACOS_CERTIFICATE_PASSWORD"
          [ -n "$APPLE_ID" ] || missing="$missing NOTARIZATION_APPLE_ID"
          [ -n "$APPLE_PASSWORD" ] || missing="$missing NOTARIZATION_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::This release would be unsigned. Add these repository secrets and push the tag again:$missing"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # One version, written in four files: the bundle's (tauri.conf.json), the one the app
      # shows (Cargo, through the workspace), and the two package.json files. The same
      # comparison, without the tag, is a test in src-tauri/src/lib.rs. (After the toolchain
      # step, because it asks cargo.)
      - name: The tag must match the version everywhere it is written
        run: |
          fail=0
          check() {
            if [ "v$2" != "$GITHUB_REF_NAME" ]; then
              echo "::error title=Tag and version differ::Tag is $GITHUB_REF_NAME but $1 says $2."
              fail=1
            fi
          }
          check "src-tauri/tauri.conf.json" "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          check "package.json" "$(node -p "require('./package.json').version")"
          check "ui/package.json" "$(node -p "require('./ui/package.json').version")"
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          for crate in authexodus authexodus-core; do
            check "Cargo ($crate)" "$(node -p "require(process.argv[1]).packages.find(p => p.name === process.argv[2]).version" "$RUNNER_TEMP/metadata.json" "$crate")"
          done
          exit $fail

      # No version here: pnpm/action-setup reads "packageManager" from package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No Rust cache and no pnpm cache: see the note on caches at the top.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build
      - run: cargo test --workspace
      - run: pnpm -C ui test

      - name: Build, sign and notarize the universal .dmg
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1 (v1.0.0)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: authexodus ${{ github.ref_name }}
          releaseBody: "Pre-release. Read the README before using it, and run docs/manual-device-checklist.md if you want to help verify it."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg

      - name: Check that the .dmg is signed and notarized
        run: |
          dmg=$(find target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          echo "Checking $dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg" || echo "::warning::The .dmg itself has no stapled ticket; checking the app inside."
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          app=$(find "$mnt" -maxdepth 1 -name "*.app" | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          hdiutil detach "$mnt" -quiet

      - name: Attach a checksum file to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd target/universal-apple-darwin/release/bundle/dmg
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
