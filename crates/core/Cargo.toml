[package]
name = "authexodus-core"
description = "authexodus core: Authy backup decryption, export formats, TLS-intercepting proxy, Bitwarden apply. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Makes `proxy::TestUpstream` constructible: a stand-in for Authy with its own trust root, which
# also lifts the proxy's destination rules. For tests only; never enable it in a shipped build.
test-upstream = []

[dependencies]
# async runtime and plumbing
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"
# serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
# secrets: RustCrypto, previous generation (digest 0.10 / cipher 0.4), known to coexist
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "std"] }
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2"
base64 = "0.22"
hex = "0.4"
# export
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
prost = "0.14"
# proxy and certificate authority. The proxy is hyper + tokio-rustls. async-compression undoes
# the Content-Encoding of Authy's responses (a copy only; the device gets the bytes as sent).
# hyper-rustls `webpki-tokio` supplies the public web roots the proxy verifies Authy against.
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
time = "0.3"
# Bitwarden CLI download and unpack
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The crate's own integration tests need `test-upstream`. A dev-dependency on itself switches
# the feature on whenever tests are built, and never for a normal build.
authexodus-core = { path = ".", features = ["test-upstream"] }
tempfile = "3"
# Reads back the certificates the authority makes, in its tests.
x509-parser = { version = "0.18", features = ["verify"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tokio = { version = "1", features = ["full", "test-util"] }
