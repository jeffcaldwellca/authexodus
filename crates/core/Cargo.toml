[package]
name = "authexodus-core"
description = "authexodus core: Authy backup decryption, export formats, TLS-intercepting proxy, Bitwarden apply. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Every dependency Batch 1 packages plausibly need is declared here up front so the four
# packages built in parallel do not collide on this manifest. Unused ones cost nothing.
[dependencies]
# async runtime and plumbing
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
thiserror = "2"
# serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
# secrets: RustCrypto, previous generation (digest 0.10 / cipher 0.4), known to coexist
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "std"] }
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2"
base64 = "0.22"
hex = "0.4"
# export
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
prost = "0.14"
# proxy and certificate authority (hudsucker spike passed: see proxy.rs)
hudsucker = { version = "0.25", features = ["rcgen-ca", "rustls-client", "decoder"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs"] }
http-body-util = "0.1"
tower-service = "0.3"
# Bitwarden CLI download and unpack
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
x509-parser = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls-pemfile = "2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tokio = { version = "1", features = ["full", "test-util"] }
